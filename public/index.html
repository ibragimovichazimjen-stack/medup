<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MED-UP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3B7DD8">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MED-UP">
<link rel="icon" type="image/png" href="/icons/favicon.png">


</head>
<body>
  <div id="navContainer"></div>

  <div class="card">
    <h2 class="section-title" id="welcomeText">Добро пожаловать</h2>
    <p class="section-subtitle">Платформа подготовки к экзаменам ТГМУ</p>

    <div class="stats-grid stats-grid-2">
      <div class="stat-card">
        <div class="stat-number" id="statStudents">—</div>
        <div class="stat-label">Пользователей</div>
      </div>
      <div class="stat-card version-tile" id="versionTile" ondblclick="openVersionsPanel()">
        <div class="stat-number" id="statVersion">—</div>
        <div class="stat-label">Версия платформы</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 class="section-title" style="margin:0">Объявления</h2>
      <button class="btn btn-primary" id="addAnnouncementBtn" style="display:none" onclick="toggleAddForm()">+ Добавить</button>
    </div>

    <div class="add-form" id="addForm" style="display:none">
      <input type="text" id="annoTitle" placeholder="Заголовок объявления">
      <textarea id="annoContent" placeholder="Текст объявления"></textarea>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" onclick="saveAnnouncement()">Сохранить</button>
        <button class="btn btn-secondary" onclick="toggleAddForm()">Отмена</button>
      </div>
    </div>

    <div id="announcementsList">
      <p style="color:var(--text-secondary); font-size:14px;">Загрузка...</p>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    // ============================================================
    // 1. ИНИЦИАЛИЗАЦИЯ НАВИГАЦИИ (выполняется сразу)
    // ============================================================
    initNav('home');

    // ============================================================
    // 2. ПЕРЕМЕННЫЕ
    // ============================================================
    let editingId = null;

    // ============================================================
    // 3. ОСНОВНОЙ БЛОК — ЖДЁМ ПОЛНОЙ ЗАГРУЗКИ DOM
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      // Приветствие
      document.getElementById('welcomeText').textContent = `Добро пожаловать, ${currentUser.name || ''}!`;

      // Кнопка "Добавить" для админа
      if (isAdmin) {
        document.getElementById('addAnnouncementBtn').style.display = 'block';
      }

      // Кнопка "+ Новая версия" видна только суперадмину
      if (isSuperAdmin) {
        document.getElementById('addVersionBtn').style.display = 'block';
      }

      // Загрузка данных
      loadStats();
      loadAnnouncements();
    });

    // ============================================================
    // 4. ФУНКЦИИ СТАТИСТИКИ И ОБЪЯВЛЕНИЙ
    // ============================================================

    async function loadStats() {
      const res = await fetch('/stats');
      const data = await res.json();
      document.getElementById('statStudents').textContent = data.students;

      const vRes = await fetch('/versions/latest');
      const vData = await vRes.json();
      document.getElementById('statVersion').textContent = 'v' + vData.version_number;
    }

    async function loadAnnouncements() {
      const res = await fetch('/announcements');
      const data = await res.json();
      const container = document.getElementById('announcementsList');

      if (data.length === 0) {
        container.innerHTML = '<p style="color:var(--text-secondary); font-size:14px;">Объявлений пока нет</p>';
        return;
      }

      container.innerHTML = data.map(a => `
        <div class="announcement-card">
          <div class="announcement-title">${a.title}</div>
          <div class="announcement-content">${a.content}</div>
          <div class="announcement-meta">${a.author_name} · ${new Date(a.created_at).toLocaleDateString('ru')}</div>
          ${isAdmin ? `
            <div class="announcement-actions">
              <button class="btn btn-secondary" style="padding:6px 12px; font-size:13px;" onclick="startEdit(${a.id}, '${escStr(a.title)}', '${escStr(a.content)}')">Редактировать</button>
              <button class="btn btn-secondary" style="padding:6px 12px; font-size:13px; color:var(--error-text);" onclick="deleteAnnouncement(${a.id})">Удалить</button>
            </div>` : ''}
        </div>
      `).join('');
    }

    function escStr(str) {
      return str.replace(/'/g, "\\'").replace(/\n/g, '\\n');
    }

    function toggleAddForm() {
      const form = document.getElementById('addForm');
      const visible = form.style.display !== 'none';
      form.style.display = visible ? 'none' : 'block';
      if (visible) {
        editingId = null;
        document.getElementById('annoTitle').value = '';
        document.getElementById('annoContent').value = '';
      }
    }

    function startEdit(id, title, content) {
      editingId = id;
      document.getElementById('annoTitle').value = title.replace(/\\n/g, '\n');
      document.getElementById('annoContent').value = content.replace(/\\n/g, '\n');
      document.getElementById('addForm').style.display = 'block';
      document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
    }

    async function saveAnnouncement() {
      const title = document.getElementById('annoTitle').value.trim();
      const content = document.getElementById('annoContent').value.trim();
      if (!title || !content) {
        alert('Заполни заголовок и текст');
        return;
      }

      const url = editingId ? `/announcements/${editingId}` : '/announcements';
      const method = editingId ? 'PUT' : 'POST';

      await fetch(url, {
        method,
        headers: authHeaders(),
        body: JSON.stringify({ title, content })
      });

      editingId = null;
      toggleAddForm();
      loadAnnouncements();
    }

    async function deleteAnnouncement(id) {
      if (!confirm('Удалить объявление?')) return;
      await fetch(`/announcements/${id}`, {
        method: 'DELETE',
        headers: authHeaders()
      });
      loadAnnouncements();
    }

    // ============================================================
    // 5. ПАНЕЛЬ ВЕРСИЙ (HTML + JS)
    // ============================================================
  </script>


  <!-- Полноэкранная панель версий -->
  <div id="versionsPanel" class="versions-panel">
    <div class="versions-panel-header">
      <button class="btn btn-secondary" onclick="closeVersionsPanel()">← Выйти</button>
      <h2 style="margin:0">История версий</h2>
      <div style="width:90px"></div>
    </div>

    <div class="versions-panel-body">
      <div id="versionAddForm" class="add-form" style="display:none; max-width:640px; margin:0 auto 24px;">
        <input type="text" id="vNumber" placeholder="Номер версии, например 1.3">
        <input type="text" id="vTitle" placeholder="Заголовок">
        <textarea id="vContent" placeholder="Что изменилось / что исправлено"></textarea>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary" onclick="saveVersion()">Сохранить</button>
          <button class="btn btn-secondary" onclick="toggleVersionForm()">Отмена</button>
        </div>
      </div>

      <div style="max-width:640px; margin:0 auto 16px; display:flex; justify-content:flex-end;">
        <button class="btn btn-primary" id="addVersionBtn" style="display:none" onclick="toggleVersionForm()">+ Новая версия</button>
      </div>

      <div id="versionsList" style="max-width:640px; margin:0 auto;"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // 6. ФУНКЦИИ ДЛЯ РАБОТЫ С ВЕРСИЯМИ
    // ============================================================

    let editingVersionId = null;

    function openVersionsPanel() {
      document.getElementById('versionsPanel').classList.add('open');
      loadVersionsList();
    }

    function closeVersionsPanel() {
      document.getElementById('versionsPanel').classList.remove('open');
    }

    function toggleVersionForm() {
      const form = document.getElementById('versionAddForm');
      const visible = form.style.display !== 'none';
      form.style.display = visible ? 'none' : 'block';
      if (visible) {
        editingVersionId = null;
        document.getElementById('vNumber').value = '';
        document.getElementById('vTitle').value = '';
        document.getElementById('vContent').value = '';
      }
    }

    function escVer(str) {
      return str.replace(/'/g, "\\'").replace(/\n/g, '\\n');
    }

    async function loadVersionsList() {
      const res = await fetch('/versions');
      const data = await res.json();
      const container = document.getElementById('versionsList');

      if (data.length === 0) {
        container.innerHTML = '<p style="color:var(--text-secondary); font-size:14px;">Версий пока нет</p>';
        return;
      }

      container.innerHTML = data.map(v => `
        <div class="announcement-card">
          <div class="announcement-title">v${v.version_number} — ${v.title}</div>
          <div class="announcement-content" style="white-space:pre-line">${v.content}</div>
          <div class="announcement-meta">${v.author_name || ''} · ${new Date(v.created_at).toLocaleDateString('ru')}</div>
          ${isSuperAdmin ? `
            <div class="announcement-actions">
              <button class="btn btn-secondary" style="padding:6px 12px; font-size:13px;" onclick="startEditVersion(${v.id}, '${escVer(v.version_number)}', '${escVer(v.title)}', '${escVer(v.content)}')">Редактировать</button>
              <button class="btn btn-secondary" style="padding:6px 12px; font-size:13px; color:var(--error-text);" onclick="deleteVersion(${v.id})">Удалить</button>
            </div>` : ''}
        </div>
      `).join('');
    }

    function startEditVersion(id, number, title, content) {
      editingVersionId = id;
      document.getElementById('vNumber').value = number;
      document.getElementById('vTitle').value = title;
      document.getElementById('vContent').value = content.replace(/\\n/g, '\n');
      document.getElementById('versionAddForm').style.display = 'block';
      document.getElementById('versionAddForm').scrollIntoView({ behavior: 'smooth' });
    }

    async function saveVersion() {
      const version_number = document.getElementById('vNumber').value.trim();
      const title = document.getElementById('vTitle').value.trim();
      const content = document.getElementById('vContent').value.trim();
      if (!version_number || !title || !content) {
        alert('Заполни все поля');
        return;
      }

      const url = editingVersionId ? `/versions/${editingVersionId}` : '/versions';
      const method = editingVersionId ? 'PUT' : 'POST';

      await fetch(url, {
        method,
        headers: authHeaders(),
        body: JSON.stringify({ version_number, title, content })
      });

      editingVersionId = null;
      toggleVersionForm();
      loadVersionsList();
      loadStats();
    }

    async function deleteVersion(id) {
      if (!confirm('Удалить эту запись версии?')) return;
      await fetch(`/versions/${id}`, {
        method: 'DELETE',
        headers: authHeaders()
      });
      loadVersionsList();
      loadStats();
    }
  </script>

</body>
</html>
